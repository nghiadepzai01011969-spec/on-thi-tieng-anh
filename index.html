<head>

    <style>
        :root {
            --bg-main: #f0fdf4;
            --bg-card: #ffffff;
            --primary: #059669;
            --primary-dark: #065f46;
            --primary-light: #d1fae5;
            --accent: #d97706;
            --accent-bg: #fef3c7;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #ecfdf5 0%, #f0f9ff 50%, #fefce8 100%);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Animations nhẹ nhàng, chill, không tốn RAM */
        @keyframes swayChill {
            0%, 100% { transform: rotate(-2deg) translateY(0px); }
            50% { transform: rotate(2deg) translateY(-4px); }
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        @keyframes pulseCircle {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.55); }
            50% { transform: scale(1.08); box-shadow: 0 0 0 7px rgba(22, 163, 74, 0); }
        }

        .sway-box {
            animation: swayChill 4s ease-in-out infinite;
        }

        .float-box {
            animation: floatSlow 3.5s ease-in-out infinite;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #065f46 0%, #047857 50%, #0f766e 100%);
            color: white;
            padding: 24px 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            border-bottom: 4px solid #fbbf24;
        }

        .container {
            max-width: 1080px;
            margin: 0 auto;
        }

        .header-top {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: stretch;
            gap: 24px;
        }

        .header-info {
            flex: 1 1 420px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand-badge {
            display: inline-block;
            align-self: flex-start;
            background: rgba(251, 191, 36, 0.25);
            border: 1px solid #fbbf24;
            color: #fef08a;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 6px;
        }

        h1 {
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 900;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
        }

        .subtitle {
            color: #a7f3d0;
            font-size: 15px;
            margin-top: 4px;
        }

        /* Khung LIVE CHILL kéo dài hết khoảng dư & bỏ viền đen bên ngoài */
        .live-chill-screen {
            position: relative;
            flex: 1 1 380px;
            width: 100%;
            background: linear-gradient(145deg, #064e3b 0%, #033a2c 100%);
            border: 2.5px solid #10b981;
            border-radius: 22px;
            padding: 20px 28px 16px;
            text-align: center;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18), inset 0 0 24px rgba(16, 185, 129, 0.16);
        }

        .live-pill {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #ef4444;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.4px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: #ffffff;
            border-radius: 50%;
            display: inline-block;
        }

        .chill-avatar-circle {
            width: 96px;
            height: 96px;
            margin: 8px auto 10px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chill-avatar-svg {
            width: 74px;
            height: 74px;
        }

        .live-chill-caption {
            color: #a7f3d0;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        /* Nội dung bài tập */
        main {
            max-width: 1080px;
            margin: 22px auto 0;
            padding: 0 16px;
        }

        .section-block {
            background: var(--bg-card);
            border-radius: 18px;
            border: 2px solid #e2e8f0;
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
        }

        .section-header {
            background: #f1f5f9;
            padding: 14px 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .section-title {
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;
        }

        .section-tip {
            margin-top: 6px;
            font-size: 13.5px;
            background: #fef3c7;
            color: #92400e;
            padding: 6px 12px;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
            font-weight: 600;
        }

        .questions-list {
            padding: 16px;
            display: grid;
            gap: 16px;
        }

        .q-card {
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
            background: #ffffff;
            transition: transform 0.2s, border-color 0.2s;
        }

        .q-card:hover {
            border-color: #6ee7b7;
        }

        .q-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .q-num {
            background: #0f172a;
            color: white;
            font-weight: 800;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .q-stem {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
        }

        /* Đáp án A B C D và Khoanh đỏ động */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .opt-item {
            padding: 9px 12px;
            border-radius: 10px;
            border: 1.5px solid #cbd5e1;
            background: #f8fafc;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14.5px;
            font-weight: 600;
            color: #334155;
        }

        .opt-item.correct {
            border: 2.5px solid #16a34a;
            background: #dcfce7;
            color: #14532d;
            font-weight: 800;
            box-shadow: 0 2px 8px rgba(22, 163, 74, 0.15);
        }

        .opt-letter {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            background: #e2e8f0;
            color: #334155;
            flex-shrink: 0;
        }

        /* Hiệu ứng khoanh xanh lá vào đáp án đúng */
        .opt-item.correct .opt-letter {
            background: #16a34a;
            color: #ffffff;
            border: 2px solid #15803d;
            animation: pulseCircle 1.8s infinite;
        }

        /* 4 ô giải thích chi tiết */
        .explain-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 10px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
        }

        .exp-box {
            font-size: 13.5px;
            padding: 8px 10px;
            border-radius: 8px;
            background: white;
            border-left: 3.5px solid #059669;
        }

        .exp-box.sign { border-left-color: #2563eb; }
        .exp-box.method { border-left-color: #7c3aed; }
        .exp-box.reason { border-left-color: #16a34a; }
        .exp-box.trans { border-left-color: #0d9488; }

        .exp-label {
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
            color: #475569;
        }
    </style>
</head>

function renderContent() {
    const main = document.getElementById('mainContent');
    let html = '';

    PAGES_DATA.forEach(page => {
        page.sections.forEach(sec => {
            let qHtml = '';
            sec.questions.forEach(q => {
                let optsHtml = '';
                q.options.forEach(opt => {
                    const isCorrect = opt.letter === q.correct;
                    optsHtml += `
                        <div class="opt-item ${isCorrect ? 'correct' : ''}">
                            <span class="opt-letter">${opt.letter}</span>
                            <span>${opt.text}</span>
                        </div>
                    `;
                });

                qHtml += `
                    <div class="q-card">
                        <div class="q-top">
                            <span class="q-num">${q.num}</span>
                        </div>
                        <div class="q-stem">${q.stem}</div>
                        <div class="options-grid">${optsHtml}</div>
                        <div class="explain-grid">
                            <div class="exp-box sign">
                                <span class="exp-label">🔍 Dấu hiệu nhận biết</span>
                                ${q.sign}
                            </div>
                            <div class="exp-box method">
                                <span class="exp-label">🛠️ Biện pháp / Công thức</span>
                                ${q.method}
                            </div>
                            <div class="exp-box reason">
                                <span class="exp-label">🟢 Lý do chọn đáp án (${q.correct})</span>
                                ${q.reason}
                            </div>
                            <div class="exp-box trans">
                                <span class="exp-label">🇻🇳 Dịch ý nghĩa</span>
                                ${q.translation}
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="section-block">
                    <div class="section-header">
                        <div class="section-title">${sec.sectionTitle}</div>
                        <div class="section-tip">${sec.sectionTip}</div>
                    </div>
                    <div class="questions-list">${qHtml}</div>
                </div>
            `;
        });
    });

    main.innerHTML = html;
}

// Khởi chạy ngay lập tức khi mở trang
renderContent();
